<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Page not found — Danny Algazi</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500&family=JetBrains+Mono:wght@500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --surface: #0f131d;
        --on-surface: #dfe2f1;
        --on-surface-variant: #9aa3b8;
        --surface-high: #262a35;
        --primary: #4edea3;
        --primary-strong: #10b981;
        --secondary: #4cd7f6;
        --font-display: 'Space Grotesk', system-ui, sans-serif;
        --font-body: 'Inter', system-ui, sans-serif;
        --font-mono: 'JetBrains Mono', ui-monospace, Consolas, monospace;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        background: var(--surface);
        color: var(--on-surface);
        font-family: var(--font-body);
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100svh;
        padding: 1.5rem;
        text-align: center;
        position: relative;
        overflow: hidden;
      }
      .glow {
        position: absolute;
        top: -10rem;
        left: 50%;
        transform: translateX(-50%);
        width: 40rem;
        height: 22rem;
        background: radial-gradient(closest-side, rgba(78, 222, 163, 0.14), transparent);
        pointer-events: none;
      }
      .code {
        font-family: var(--font-mono);
        font-size: 0.75rem;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--primary);
      }
      h1 {
        font-family: var(--font-display);
        font-weight: 700;
        font-size: clamp(3rem, 10vw, 5rem);
        margin: 0.5rem 0 0;
        letter-spacing: -0.02em;
      }
      p {
        color: var(--on-surface-variant);
        font-size: 1rem;
        max-width: 26rem;
        margin: 1rem auto 2rem;
        line-height: 1.6;
      }
      a.btn {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.65rem 1.25rem;
        border-radius: 0.25rem;
        background: var(--primary-strong);
        color: #04140e;
        font-family: var(--font-display);
        font-weight: 600;
        font-size: 0.9rem;
        text-decoration: none;
        box-shadow: 0 0 20px rgba(16, 185, 129, 0.25);
      }
    </style>
  </head>
  <body>
    <div class="glow"></div>
    <div>
      <div class="code">$ curl -I danny.dev/this-page</div>
      <h1>404</h1>
      <p>This route doesn&rsquo;t exist &mdash; the page you&rsquo;re looking for was moved, renamed, or never built.</p>
      <a class="btn" href="/">Back to the homepage</a>
    </div>
  </body>
</html>
